backend:
  name: github
  repo: mercedesnews/mercedesnews.github.io
  branch: main

# Dónde guarda Sveltia los archivos en el repositorio
media_folder: "public/assets/img"
# Qué ruta escribe en el Markdown para que el navegador la encuentre
public_folder: "/assets/img"

# Colecciones de contenido
collections:
  - name: "noticias"
    label: "Noticias"
    folder: "src/content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título y Subtítulo", name: "title", widget: "text", hint: "Línea 1: Título principal. Línea 2: Subtítulo (opcional)." }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - {
          label: "Categoría",
          name: "categoria",
          widget: "select",
          options: [
            { label: "Actualidad Local", value: "actualidad-local" },
            { label: "Crónicas & Particularidades", value: "cronicas" },
            { label: "Mano a Mano", value: "entrevistas" },
            { label: "Opinión & Ensayos", value: "opinion" }
          ],
          default: "actualidad-local"
        }
      - { label: "Imagen Destacada", name: "thumbnail", widget: "image", required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }
